name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    name: rust (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins 1.96.0 with profile=minimal, which omits
      # rustfmt and clippy; install them into that pinned toolchain.
      - name: components
        run: rustup component add rustfmt clippy
      - name: format
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # --workspace, or cargo tests only the root package and the 343 library
      # tests in bitblock-core and bitblock-research never run. --features, or
      # the all(windows, feature) modules are never compiled. Both gaps were
      # silent: the job stayed green while running 43 of 397 tests.
      - name: test
        run: cargo test --workspace --features protocol-research

  # The README lists Linux as supported for the library suites and headless
  # replay, but until this job only Windows ever compiled the crate in CI. It
  # passed when first run by hand (2026-11-03); this keeps it that way. The
  # replay output is uploaded so a Windows/Linux byte comparison can be repeated.
  rust-linux:
    name: rust (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: components
        run: rustup component add clippy
      - name: clippy
        run: cargo clippy --workspace --all-targets --features protocol-research -- -D warnings
      - name: test
        run: cargo test --workspace --features protocol-research
      - name: headless replay
        run: |
          cargo build --release
          for t in examples/*.tape; do
            ./target/release/bitblock --simulate-actions "$t" > "replay-$(basename "$t" .tape).txt"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: replay-linux
          path: replay-*.txt

  python-tools:
    name: python vector tools (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: powered planning-document checks
        run: python3 tools/check_planning_docs.py --self-test
      - name: standalone vector tools
        run: |
          set -e
          # Not bare validators, so they are not run here:
          #   check_planning_docs runs its own --self-test step above
          #   metric_registry   wants a subcommand (its own step runs the audit)
          #   mirror_timeline1  needs the retired timeline-1 source directory
          #   simulate_sequence takes a scenario argument
          #   bbindex/bbgraph   write and query index/; the index job gates them
          #   bbverify          is a local sweep of these same checks
          #   bbmutate          rewrites src/ on purpose and must never run here
          #   bbtime            spends ~30s profiling every test
          skip="check_planning_docs metric_registry mirror_timeline1 simulate_sequence bbindex bbgraph bbverify bbmutate bbtime"
          for t in tools/*.py; do
            name=$(basename "$t" .py)
            case " $skip " in *" $name "*) continue ;; esac
            echo "== $t"
            python3 "$t" > /dev/null
          done
      - name: expectation-checked interaction scenario
        run: python3 tools/simulate_sequence.py examples/observer_walk_sequence.json --expect > /dev/null
      - name: metric registry audit
        run: python3 tools/metric_registry.py audit

  index:
    name: generated index (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The tree is the only source of truth for index/. Regenerating must be a
      # no-op on a clean checkout; a diff means the index is older than the tree.
      # This is the staleness gate, and it is the reason index/ can be trusted
      # without anyone re-deriving it by hand.
      - name: regenerate and check for drift
        run: |
          python3 tools/bbindex.py
          git diff --exit-code -- index/
      # bbselftest.json records what the query surface must answer. A ranking
      # change nobody intended fails here rather than being discovered later.
      - name: selftest
        run: python3 tools/bbgraph.py selftest

  lean:
    name: lean proof capsule (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # lake reads proof/lean-toolchain (leanprover/lean4:v4.33.0) and elan
      # fetches exactly that. LadderLangQuotedByteParity.lean is deliberately
      # outside this target (it needs the separately pinned LadderLang
      # checkout) and is not CI'd.
      - name: build proof capsule
        working-directory: proof
        run: lake build
