[package]
name = "bitblock"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[features]
default = []
headless-console = []
protocol-research = []

[dependencies]
sha2 = { version = "=0.10.9", default-features = false }
winit = "=0.30.13"

[target.'cfg(not(windows))'.dependencies]
softbuffer = "=0.4.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Performance",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
strip = true
