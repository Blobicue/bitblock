[package]
name = "bitblock-research"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[dependencies]
# Unconditionally feature-enabled: this crate *is* the research surface, so the
# core variants it needs are never optional from here.
bitblock-core = { path = "../core", features = ["protocol-research"] }
sha2 = { version = "=0.10.9", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Performance",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
