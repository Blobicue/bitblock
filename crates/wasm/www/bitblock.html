<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BitBlock</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; align-items: center; justify-content: center; background: #0b0b0d; color: #e8e8e8;
         font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  main { text-align: center; max-width: 34rem; padding: 2rem; }
  h1 { font-size: 2.4rem; letter-spacing: 0.12em; margin: 0 0 0.75rem; }
  p { color: #aab; line-height: 1.5; margin: 0 0 2rem; }
  #launch { font: inherit; font-size: 1.25rem; padding: 0.8rem 2.6rem; border: 1px solid #3a6; border-radius: 6px;
            background: #1d3a26; color: #dfffe8; cursor: pointer; text-decoration: none; display: inline-block; }
  #launch:hover, #launch:focus { background: #25502f; outline: none; }
  .secondary { margin-top: 2.5rem; font-size: 0.8rem; color: #667; }
  .secondary a { color: #8aa; }
  #launchNote { min-height: 1.2em; margin-top: 1rem; font-size: 0.8rem; color: #888; }
</style>
</head>
<body>
<main>
  <h1>BITBLOCK</h1>
  <p>A voxel world you build bit by bit. Runs entirely in your browser from this folder — no install, no server.</p>
  <!-- href/target = no-JS fallback; with JS, Launch opens the play client in its own window. -->
  <a id="launch" href="play.html" target="bitblock-play">Launch</a>
  <div id="launchNote"></div>
  <div class="secondary"><a href="bitblock-lab.html">Lab</a> — demos, gallery, research, storage, play tape (known answers)</div>
</main>
<script>
(function () {
  const launch = document.getElementById("launch");
  const note = document.getElementById("launchNote");
  let client = null;
  launch.addEventListener("click", function (event) {
    event.preventDefault();
    // Re-focus an already-open client instead of starting a second session.
    if (client && !client.closed) { client.focus(); note.textContent = "BitBlock is already running in its window."; return; }
    const w = Math.min(screen.availWidth || 1720, 1720), h = Math.min(screen.availHeight || 900, 900);
    client = window.open("play.html", "bitblock-play", "popup=yes,width=" + w + ",height=" + h);
    if (client) { client.focus(); note.textContent = "BitBlock opened in its own window."; }
    else { location.href = "play.html"; } // popup blocked: run the client in this tab
  });
})();
</script>
</body>
</html>
