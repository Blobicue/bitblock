[workspace]
resolver = "2"
members = [
    "crates/bitblock-light-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
bitblock-core = { path = "../crates/core" }
bitblock-research = { path = "../crates/research" }
sha2 = { version = "=0.10.9", default-features = false }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = true
